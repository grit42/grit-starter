services:
  db:
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=default
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    image: "grit42com/pgrdkit:16.3-2024.03.1"
    platform: linux/amd64
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "3000:3000"
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
    image: "grit42com/grit:latest"
    platform: linux/amd64
    restart: unless-stopped
    volumes:
      - file_storage:/rails/apps/grit/server/storage

  backup:
    profiles: ["tools"]
    image: "grit42com/pgrdkit:16.3-2024.03.1"
    depends_on:
      - db
    entrypoint: ["/bin/bash", "/backup-scripts/backup.sh"]
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - GRIT_DATABASE=${GRIT_DATABASE}
    volumes:
      - ./grit-backups:/backups
      - file_storage:/file_storage:ro
      - ./scripts/backup.sh:/backup-scripts/backup.sh:ro

  restore:
    profiles: ["tools"]
    image: "grit42com/pgrdkit:16.3-2024.03.1"
    depends_on:
      - db
    entrypoint: ["/bin/bash", "/backup-scripts/restore.sh"]
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - GRIT_DATABASE=${GRIT_DATABASE}
      - BACKUP_TIMESTAMP=${BACKUP_TIMESTAMP:-latest}
    volumes:
      - ./grit-backups:/backups
      - file_storage:/file_storage
      - ./scripts/restore.sh:/backup-scripts/restore.sh:ro

  backup-list:
    profiles: ["tools"]
    image: "grit42com/pgrdkit:16.3-2024.03.1"
    entrypoint: ["/bin/bash", "/backup-scripts/backup-list.sh"]
    volumes:
      - ./grit-backups:/backups:ro
      - ./scripts/backup-list.sh:/backup-scripts/backup-list.sh:ro

  backup-cleanup:
    profiles: ["tools"]
    image: "grit42com/pgrdkit:16.3-2024.03.1"
    environment:
      - KEEP_LAST=${KEEP_LAST:-5}
      - DRY_RUN=${DRY_RUN:-false}
    entrypoint: ["/bin/bash", "/backup-scripts/backup-cleanup.sh"]
    volumes:
      - ./grit-backups:/backups
      - ./scripts/backup-cleanup.sh:/backup-scripts/backup-cleanup.sh:ro

volumes:
  postgres_data:
  file_storage:
